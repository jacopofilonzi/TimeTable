# Example deployment: TimeTable + Redis. Values come from `.env` (see .env.example).
# The service speaks plain HTTP; put a reverse proxy in front of it for HTTPS.
name: timetable

services:
  server:
    build: .
    image: timetable:latest
    container_name: timetable
    restart: unless-stopped
    ports:
      - "${PUBLISH_PORT:-8080}:8080"
    environment:
      BASE_PATH: ${BASE_PATH:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      CACHE_LESSONS_TTL: ${CACHE_LESSONS_TTL:-21600}
      CACHE_OPTIONS_TTL: ${CACHE_OPTIONS_TTL:-86400}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      SHORTLINK_DB: ${SHORTLINK_DB:-/data/shortlinks.db}
      FEED_STATS_DB: ${FEED_STATS_DB:-/data/feed_stats.db}
      FEED_STATS_RETENTION_DAYS: ${FEED_STATS_RETENTION_DAYS:-365}
      STATS_TOKEN: ${STATS_TOKEN:-}
      RUST_LOG: info
      LOG_FORMAT: compact
    volumes:
      # Short links and usage log (the volume keeps its original name so existing data stays).
      - shortlinks-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - internal

  redis:
    image: redis:8-alpine
    container_name: timetable-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "300 1"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - internal

volumes:
  redis-data:
  # Short links and usage log: unlike Redis this is not a cache, back it up.
  shortlinks-data:

networks:
  # Redis is reachable only from the timetable container.
  internal:
    internal: true
